name: Video Generator (Twice Daily)

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

# Never let two generator runs overlap (they both push to the repo)
concurrency:
  group: postai-generator
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # FFmpeg comes bundled with the imageio-ffmpeg pip package. This step proves it
      # can really encode video and audio the way the pipeline needs.
      - name: Check FFmpeg
        run: |
          FFMPEG_EXE="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "Using FFmpeg at: $FFMPEG_EXE"
          "$FFMPEG_EXE" -version | head -1
          "$FFMPEG_EXE" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=duration=1:size=320x240:rate=30" \
            -f lavfi -i "anullsrc=r=44100:cl=stereo" \
            -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/smoke.mp4"
          test -s "$RUNNER_TEMP/smoke.mp4"
          echo "FFmpeg can encode H.264 video and AAC audio."

      # The captions need a bold TrueType font
      - name: Check caption font
        run: |
          found=""
          for f in /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
                   /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf \
                   fonts/*.ttf fonts/*.otf; do
            if [ -f "$f" ]; then found="$f"; break; fi
          done
          if [ -z "$found" ]; then
            echo "No bold font found. Add a .ttf file to a 'fonts' folder in the repo."
            exit 1
          fi
          echo "Caption font: $found"

      - name: Run Main Video Pipeline
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: set these under Settings > Secrets and variables > Actions > Variables
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          VOICEOVER: ${{ vars.VOICEOVER }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
        run: |
          python main.py

      # This step only runs if main.py succeeded (a failed run saves nothing).
      # It rebuilds the commit on top of the latest remote state, so it cannot
      # conflict with the publisher workflow, and retries if the push is rejected.
      - name: Save Video & Database State to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cp automation.db "$RUNNER_TEMP/automation.db"
          cp final_ready_video.mp4 "$RUNNER_TEMP/final_ready_video.mp4"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/automation.db" automation.db
            cp "$RUNNER_TEMP/final_ready_video.mp4" final_ready_video.mp4
            git add -f automation.db final_ready_video.mp4

            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi

            git commit -m "Auto-generated new video and updated category rotation"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected, retrying (attempt $attempt of 3)..."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1