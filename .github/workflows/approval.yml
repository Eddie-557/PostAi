name: Approval Listener

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Only one listener at a time, so a button press is never handled twice
concurrency:
  group: postai-approval
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # needed to start the publisher workflow

    steps:
      # Download only the listener script (not the big video files in the repo)
      - name: Checkout Listener Script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            approval_listener.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check for Approvals
        env:
          PYTHONUNBUFFERED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python approval_listener.py